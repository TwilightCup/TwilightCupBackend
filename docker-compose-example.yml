version: "3"

services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: twilightcup
      MONGO_INITDB_ROOT_PASSWORD: change-me-in-prod
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    environment:
      MONGO_URI: mongodb://twilightcup:change-me-in-prod@mongo:27017
      DB_NAME: twilightcup
      JWT_SECRET: change-me-in-prod
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: twilightcup
      S3_SECURE: "false"
      S3_PUBLIC_BASE_URL: https://bsrserver.org.cn:8443/assets
    depends_on:
      - mongo
      - minio
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 1G

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  minio-data:
