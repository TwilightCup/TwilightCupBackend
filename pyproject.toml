[project]
name = "twilightcupbackend"
version = "0.1.0"
description = "黄昏杯 (Twilight Cup) 1v1 速通比赛中转服务端"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
authors = [{ name = "TwilightCup" }]
dependencies = [
    "fastapi>=0.119.1",
    "classy-fastapi>=0.7.0",
    "uvicorn[standard]>=0.38.0",
    "uvloop>=0.21.0; sys_platform == 'darwin' or sys_platform == 'linux'",
    "orjson>=3.11.3",
    "pydantic>=2.12.3",
    "pymongo>=4.10",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.1.1",
    "cachetools>=6.2.1",
    "pyjwt>=2.9",
    "minio>=7.2",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "mongomock>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twilightcupbackend"]

# 阿里云 PyPI 镜像作为默认源（替代官方 index-url，等价于 --index-url）
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# 中文注释/文档串中含全角标点（：，（）等），关闭“歧义 Unicode”告警
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["twilightcupbackend"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 大量在默认参数中调用 Depends/Query/Body 等，将其视为不可变调用
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "fastapi.params.Depends",
]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
