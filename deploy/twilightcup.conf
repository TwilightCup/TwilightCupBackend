# 黄昏杯站点：https://bsrserver.org.cn:5173
# 放置路径：/data/twilight_cup/nginx/twilightcup.conf（nginx 容器内 /etc/nginx/conf.d/）
# conf.d 整目录 bind mount，本文件是唯一 server（镜像 default.conf 已被遮蔽）。
# 前端【当前为 dev 实时模式】：Vite dev server 跑在宿主机 tmux 会话 twilightcup 右分屏，
#   :5174（--strictPort），改动经 HMR 实时生效；切回静态模式见文件底部注释。
# 后端：宿主机 tmux 会话 twilightcup，0.0.0.0:8100（经 host.docker.internal:host-gateway 回连）
# 对象存储：SeaweedFS S3 网关（compose 内部 seaweedfs:8333，桶 twilightcup，匿名公开读）

# WebSocket Upgrade/Connection 头映射（conf.d 文件位于 http 上下文，map 合法）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    http2 on;                    # nginx >= 1.25.1 用独立指令，listen 里写 http2 已废弃
    server_name bsrserver.org.cn www.bsrserver.org.cn;

    ssl_certificate     /etc/nginx/cert/bsrserver.org.cn.pem;   # fullchain
    ssl_certificate_key /etc/nginx/cert/bsrserver.org.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 后端上传限 5MB，nginx 放宽到 10m（否则 413）
    client_max_body_size 10m;

    # ---- REST：剥掉 /api 前缀（与 Vite dev 代理 rewrite 等价；两端斜杠=前缀替换）----
    location /api/ {
        proxy_pass http://host.docker.internal:8100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- WebSocket：proxy_pass 不带 URI → /ws/{token} 原样透传 ----
    location /ws/ {
        proxy_pass http://host.docker.internal:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # 客户端心跳 25s，留足余量
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;             # 长连接只记建连/断开，避免噪音
    }

    # ---- 对象存储公开读：/assets/<key> → /twilightcup/<key> ----
    location /assets/ {
        proxy_pass http://seaweedfs:8333/twilightcup/;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=86400";   # key 是 uuid，内容不变
    }

    # ---- 前端：反代 Vite dev server（tmux 右分屏 :5174，HMR 实时生效）----
    # Upgrade/Connection 头同时服务 /@vite/client 的 HMR WebSocket 长连接
    # （其连接目标取自页面源 import.meta.url → wss://bsrserver.org.cn:5173/，落到本 location）
    location / {
        proxy_pass http://host.docker.internal:5174;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
}

# ─────────────────────────────────────────────────────────────────────
# 切回静态部署模式：把上面的 `location /` 块整体替换为下面两段，然后
# `npm run build && rsync -a --delete dist/ /data/twilight_cup/web/` + nginx reload：
#
#     location /static/ {
#         root /usr/share/nginx/html;
#         add_header Cache-Control "public, max-age=604800, immutable";
#     }
#     location / {
#         root /usr/share/nginx/html;
#         index index.html;
#         try_files $uri $uri/ /index.html;
#     }
# ─────────────────────────────────────────────────────────────────────
